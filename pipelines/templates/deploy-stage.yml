parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: environmentName
    type: string
  - name: enabled
    type: boolean
    default: false
  - name: dependsOn
    type: string
  - name: kubernetesServiceConnection
    type: string
  - name: namespace
    type: string
  - name: containerRegistry
    type: string
  - name: shellImageRepository
    type: string
  - name: paymentsImageRepository
    type: string
  - name: imageTag
    type: string
  - name: runtimeEnvironment
    type: string
  - name: apiBaseUrl
    type: string
  - name: paymentsRemoteEntry
    type: string

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: and(succeeded(), ${{ eq(parameters.enabled, true) }}, eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Deploy
        displayName: Deploy immutable build
        environment: ${{ parameters.environmentName }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - bash: |
                    set -euo pipefail
                    mkdir -p $(Pipeline.Workspace)/rendered
                    sed \
                      -e 's|__APP_ENVIRONMENT__|${{ parameters.runtimeEnvironment }}|g' \
                      -e 's|__APP_VERSION__|${{ parameters.imageTag }}|g' \
                      -e 's|__API_BASE_URL__|${{ parameters.apiBaseUrl }}|g' \
                      -e 's|__PAYMENTS_REMOTE_ENTRY__|${{ parameters.paymentsRemoteEntry }}|g' \
                      deploy/k8s/runtime-config.template.yaml \
                      > $(Pipeline.Workspace)/rendered/runtime-config.yaml
                  displayName: Render environment runtime config

                - task: KubernetesManifest@1
                  displayName: Deploy manifests
                  inputs:
                    action: deploy
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceConnection: ${{ parameters.kubernetesServiceConnection }}
                    namespace: ${{ parameters.namespace }}
                    manifests: |
                      $(Pipeline.Workspace)/rendered/runtime-config.yaml
                      deploy/k8s/shell.yaml
                      deploy/k8s/payments.yaml
                    containers: |
                      ${{ parameters.containerRegistry }}/${{ parameters.shellImageRepository }}:${{ parameters.imageTag }}
                      ${{ parameters.containerRegistry }}/${{ parameters.paymentsImageRepository }}:${{ parameters.imageTag }}
