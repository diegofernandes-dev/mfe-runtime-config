server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location = /assets/runtime-config.json { add_header Cache-Control "no-store, no-cache, must-revalidate" always; try_files $uri =404; }
  location ~* \.(js|css|woff2|png|svg)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
