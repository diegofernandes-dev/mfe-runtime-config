apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfe-shell
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mfe-shell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mfe-shell
    spec:
      containers:
        - name: shell
          image: __SHELL_IMAGE__
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mfe-shell-runtime-config
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mfe-shell
spec:
  selector:
    app.kubernetes.io/name: mfe-shell
  ports:
    - port: 80
      targetPort: 8080
